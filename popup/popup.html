<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a2e;
      color: #fff;
      margin: 0;
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #8892b0;
      margin-bottom: 16px;
    }
    .status {
      background: #16213e;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00ff88;
      margin-right: 6px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 12px;
      font-size: 12px;
      color: #a0aec0;
    }
    .footer {
      font-size: 11px;
      color: #4a5568;
      border-top: 1px solid #2d3748;
      padding-top: 10px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="logo">KnucklesGuard</div>
  <div class="subtitle">Blocks ads on every website</div>
  <div class="status">
    <span class="dot"></span> Ad blocking active
  </div>
  <div class="stats">
    <span>YouTube + All websites</span>
  </div>
  <div class="footer">v1.0</div>
  <script src="popup.js"></script>
</body>
</html>
